name: speaker-workbench

x-common: &common
  restart: unless-stopped
  env_file: .env

services:
  postgres:
    <<: *common
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["5432:5432"]

  redis:
    <<: *common
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    ports: ["6379:6379"]

  api:
    <<: *common
    build: { context: ., dockerfile: api/Dockerfile }
    command: ["uvicorn", "api.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/api", "--reload-dir", "/app/common"]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    volumes:
      - ./.runtime/data:/data
      - ./api/app:/app/api/app
      - ./common:/app/common
      - ./.runtime/models:/models
      - ./.hf_token:/app/.hf_token:ro
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      retries: 6

  worker:
    <<: *common
    build:
      context: .
      dockerfile: worker/Dockerfile
      secrets: [hf_token]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    volumes:
      - ./.runtime/data:/data

  web:
    <<: *common
    build: { context: ., dockerfile: web/Dockerfile }
    depends_on: [api]
    ports: ["5173:80"]

volumes:
  pgdata: {}

secrets:
  hf_token:
    file: ./.hf_token
