[project]
name = "workbench-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.*",
  "uvicorn[standard]==0.32.*",
  "pydantic-settings==2.*",
  "asyncpg==0.30.*",
  "pgvector==0.3.*",
  "arq==0.26.*",
  "redis==5.*",
  "python-multipart==0.0.*",
  "websockets==13.*",
  "structlog==24.*",
  "prometheus-client==0.21.*",
  "numpy==1.26.*",
  "torch==2.4.*",
  "sentence-transformers==3.*",
  "httpx==0.27.*",
  # graph projection only — common/graph.py imports it lazily so the worker, which shares
  # common/ but never queries the graph, does not need it in its own dependency set
  "neo4j==5.*",
]

[tool.uv]
package = false
