[project]
name = "workbench-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "arq==0.26.*",
  "asyncpg==0.30.*",
  "pgvector==0.3.*",
  "pydantic-settings==2.*",
  "structlog==24.*",
  "numpy==1.26.*",
  "scipy==1.13.*",
  "soundfile==0.12.*",
  "librosa==0.10.*",
  "pyloudnorm==0.1.*",
  "noisereduce==3.*",
  "torch==2.4.*",
  "torchaudio==2.4.*",  # must match torch's CUDA build; silero-vad pulls torchaudio unpinned otherwise
  "silero-vad==6.2.*",
  "faster-whisper==1.0.*",
  "pyannote.audio==3.1.*",
  "speechbrain==1.0.*",
  "sentence-transformers==3.*",
  "huggingface_hub==0.25.*",
  "pyyaml==6.*",
]

[tool.uv]
package = false
